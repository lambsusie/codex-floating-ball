name: Build macOS packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build unsigned DMG
        run: npm run build:mac:${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate checksum
        shell: bash
        run: |
          dmg=$(find dist -maxdepth 1 -name "Codex-Floating-Ball-*-mac-${{ matrix.arch }}.dmg" -print -quit)
          test -n "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Floating-Ball-mac-${{ matrix.arch }}
          path: |
            dist/Codex-Floating-Ball-*-mac-${{ matrix.arch }}.dmg
            dist/Codex-Floating-Ball-*-mac-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
          retention-days: 14
